<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
  <script type="module" src="newtab.js"></script>
</head>
<body>
  <div id="wall" hidden></div>
  <main id="main">
    <div class="pager" id="rootPager"><div class="track"></div></div>
    <div class="dots" id="rootDots"></div>
  </main>

  <div id="folderLayer" hidden>
    <div class="backdrop"></div>
    <section class="folder-panel" role="dialog" aria-modal="true">
      <input id="folderName" autocomplete="off" spellcheck="false" maxlength="60" data-i18n-aria="folderName">
      <p class="empty" id="folderEmpty" data-i18n="smartEmpty" hidden></p>
      <div class="pager" id="folderPager"><div class="track"></div></div>
      <div class="dots" id="folderDots"></div>
    </section>
  </div>

  <div id="toolbar">
    <button id="settingsBtn" type="button" class="round" data-i18n-aria="settings" data-i18n-title="settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
    <button id="editBtn" type="button" data-i18n="editLayout"></button>
    <button id="doneBtn" type="button" data-i18n="done" hidden></button>
  </div>
  <section id="settingsPanel" hidden>
    <h2 data-i18n="settings"></h2>
    <label class="opt"><input type="checkbox" id="setRecent"><span data-i18n="showRecent"></span></label>
    <p class="hint" id="recentHint" data-i18n="historyDenied" hidden></p>
    <label class="opt"><input type="checkbox" id="setFrequent"><span data-i18n="showFrequent"></span></label>
    <label class="opt"><input type="checkbox" id="setIcons"><span data-i18n="settingIcons"></span></label>
    <p class="hint" id="iconsHint" hidden><span data-i18n="iconsNeedAccess"></span> <button type="button" id="iconsGrant" data-i18n="grantAccess"></button></p>
    <div class="row-btns">
      <button type="button" id="wallOpen" data-i18n="wallpaperShort"></button>
      <button type="button" id="layoutReset" data-i18n="defaultView"></button>
    </div>
  </section>
  <section id="wallPanel" hidden>
    <h2 data-i18n="wallpaper"></h2>
    <div class="tabs" id="wallTabs" role="tablist"></div>
    <div class="wall-grid" id="wallGrid"></div>
    <div class="wall-custom" id="wallCustom" hidden>
      <button type="button" id="wallUploadBtn" data-i18n="wallUpload"></button>
      <input type="file" id="wallFile" accept="image/*" hidden>
      <label class="color"><span data-i18n="wallColor"></span><input type="color" id="wallColor" value="#3a2f6b"></label>
      <button type="button" id="wallReset" data-i18n="wallReset"></button>
      <p class="note" data-i18n="wallLocalNote"></p>
    </div>
    <p class="hint" id="wallError" hidden></p>
    <div class="wall-actions">
      <button type="button" id="wallCancel" data-i18n="cancel"></button>
      <button type="button" id="wallDone" class="primary" data-i18n="done"></button>
    </div>
  </section>
  <div id="credit" hidden></div>
  <div id="syncNote" role="status" hidden></div>
  <div id="menu" role="menu" hidden></div>

  <dialog id="linkDialog">
    <form id="linkForm" method="dialog">
      <h2 id="linkDialogTitle"></h2>
      <label><span data-i18n="fieldTitle"></span><input id="lTitle" maxlength="200" autocomplete="off"></label>
      <label><span data-i18n="fieldUrl"></span><input id="lUrl" autocomplete="off" spellcheck="false" placeholder="https://"></label>
      <p class="error" id="lError" data-i18n="urlInvalid" hidden></p>
      <menu>
        <button value="cancel" formnovalidate data-i18n="cancel"></button>
        <button value="save" class="primary" data-i18n="save"></button>
      </menu>
    </form>
  </dialog>

  <dialog id="folderDialog">
    <form method="dialog">
      <h2 id="folderDialogText"></h2>
      <menu>
        <button value="cancel" data-i18n="cancel"></button>
        <button value="keep" data-i18n="keepShortcuts"></button>
        <button value="delete" class="danger" data-i18n="deleteWithContents"></button>
      </menu>
    </form>
  </dialog>
</body>
</html>
